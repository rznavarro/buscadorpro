<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vortexia Prospector</title>
  <link rel="icon" type="image/png" href="/static/vortexia.png">
  <script src="/static/htmx.min.js"></script>
  <style>
    :root {
      --bg: #0e1015; --panel: #161922; --panel-2: #1d2130; --line: #2a2f3d;
      --text: #e7e9ee; --muted: #9aa1b2; --accent: #8b6cff;
      --green: #22c55e; --amber: #f5a524; --red: #ef4444; --blue: #60a5fa;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 20px 24px 60px; }
    header.top { display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; }
    header.top h1 { margin: 0; font-size: 22px; letter-spacing: .08em; }
    header.top h1 span { color: var(--accent); }
    header.top p { margin: 0; color: var(--muted); }
    header.top nav { margin-left: auto; display: flex; gap: 16px; white-space: nowrap; }
    textarea { width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
               border-radius: 8px; padding: 10px 12px; font: 13px/1.5 ui-monospace, Consolas, monospace; }
    .ok-box { background: #123321; border: 1px solid #1f6b3a; color: #b7f5c9; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
    .chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--text); background: var(--panel-2); font-size: 13px; }
    .chip:hover { border-color: var(--muted); text-decoration: none; }
    .chip.on { background: #2a2350; border-color: var(--accent); color: #d9d0ff; }
    a.name { color: var(--text); }
    h2 { margin: 0 0 4px; font-size: 22px; letter-spacing: .02em; }
    h3 { margin: 18px 0 8px; font-size: 16px; }
    .panel > h3:first-child, .two-cols h3:first-child { margin-top: 0; }
    h4 { margin: 14px 0 6px; font-size: 14px; color: var(--muted); }
    dl.kv { display: grid; grid-template-columns: 140px 1fr; gap: 10px 14px; margin: 14px 0; }
    dl.kv dt { color: var(--muted); font-size: 13px; padding-top: 2px; }
    dl.kv dd { margin: 0; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
    dl.kv dd > div { flex-basis: 100%; }
    .score { font-size: 22px; font-weight: 700; padding: 2px 10px; border-radius: 8px; border: 1px solid; }
    ol.report-list { margin: 0; padding-left: 22px; }
    ol.report-list li { margin: 8px 0; }
    .shots { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
    .shots figure { margin: 0; }
    .shots img { border: 1px solid var(--line); border-radius: 8px; display: block; }
    .shots img.shot-escritorio { width: 560px; max-width: 100%; }
    .shots img.shot-celular { width: 200px; }
    .two-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    ul.checks { list-style: none; margin: 0; padding: 0; }
    ul.checks li { margin: 6px 0; padding-left: 24px; position: relative; }
    ul.checks li::before { position: absolute; left: 0; font-weight: 700; }
    ul.checks li.yes::before { content: "✓"; color: var(--green); }
    ul.checks li.no::before { content: "✗"; color: var(--red); }
    ul.checks li.unknown::before { content: "?"; color: var(--muted); }
    pre.evidence { white-space: pre-wrap; max-height: 400px; overflow: auto; background: #0b0d12; padding: 10px; border-radius: 8px; }
    @media (max-width: 800px) { .two-cols { grid-template-columns: 1fr; } dl.kv { grid-template-columns: 1fr; } }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
    form.search { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    form.search input[type=text] { flex: 1 1 380px; }
    input, select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
                    border-radius: 8px; padding: 10px 12px; font: inherit; }
    input[type=number] { width: 90px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px;
           padding: 7px 11px; background: var(--panel-2); color: var(--text); font: inherit; font-size: 14px;
           cursor: pointer; white-space: nowrap; text-decoration: none; }
    .btn:hover { border-color: var(--muted); text-decoration: none; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; padding: 10px 18px; }
    .btn.wa { background: #12391f; border-color: #1f6b3a; color: #b7f5c9; }
    .btn.try { background: #3a2b0c; border-color: #7a5a14; color: #ffd98a; }
    .btn.ok { color: var(--green); }
    .btn.no { color: var(--red); }
    .btn.small { padding: 4px 8px; font-size: 13px; }
    .muted { color: var(--muted); }
    .notice { background: #3a2b0c; border: 1px solid #7a5a14; color: #ffd98a; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
             border: 1px solid transparent; white-space: nowrap; }
    .b-green { background: #123321; color: #8ff0b0; border-color: #1f6b3a; }
    .b-amber { background: #3a2b0c; color: #ffd98a; border-color: #7a5a14; }
    .b-red { background: #3b1414; color: #ffb4b4; border-color: #7f1d1d; }
    .b-grey { background: #252a36; color: #c2c7d3; border-color: #343a49; }
    .b-blue { background: #132845; color: #a8cbff; border-color: #1e3a66; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
         padding: 8px 10px; border-bottom: 1px solid var(--line); }
    td { padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tr.discarded td { color: var(--muted); background: #13151b; }
    .name { font-weight: 600; font-size: 15px; }
    .sub { color: var(--muted); font-size: 13px; }
    .stack { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .counters { display: flex; gap: 22px; flex-wrap: wrap; margin: 8px 0; }
    .counters b { font-size: 22px; display: block; }
    .log { font: 12.5px/1.5 ui-monospace, Consolas, monospace; color: var(--muted); max-height: 170px; overflow: auto;
           background: #0b0d12; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 10px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
    .days a { margin-right: 12px; white-space: nowrap; }
    .days a.current { color: var(--text); font-weight: 700; }
    .empty { text-align: center; padding: 40px 10px; color: var(--muted); }
    ul.findings { margin: 2px 0 0; padding-left: 16px; font-size: 13px; }
    ul.findings li { margin: 2px 0; }
    .sev-alta { color: #ff9b9b; }
    .sev-media { color: #ffd98a; }
    .sev-baja { color: var(--muted); }
    details.more { font-size: 13px; margin-top: 4px; }
    details.more summary { cursor: pointer; color: var(--blue); }
    details.more .finding { margin: 8px 0; }
    details.more ul { margin: 4px 0; padding-left: 18px; }
    .evidence { font: 12px/1.4 ui-monospace, Consolas, monospace; color: var(--muted); word-break: break-word; }
    .spinner { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--accent);
               animation: pulse 1s infinite ease-in-out; }
    @keyframes pulse { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1><a href="/" style="color:inherit;text-decoration:none">VORTEXIA <span>PROSPECTOR</span></a></h1>
      <p>Leads locales de Google Maps con web y WhatsApp verificados</p>
      <nav><a href="/">Leads</a><a href="/contactados">Ya contactados ({{ contacted_count() }})</a><a href="/registro">Registro</a></nav>
    </header>
    {% block content %}{% endblock %}
  </div>
  <script>
    // Botones "Copiar": copian el teléfono al portapapeles (no abren ni envían nada).
    document.addEventListener("click", function (event) {
      var button = event.target.closest("[data-copy]");
      if (!button) return;
      navigator.clipboard.writeText(button.dataset.copy).then(function () {
        var label = button.textContent;
        button.textContent = "Copiado ✓";
        setTimeout(function () { button.textContent = label; }, 1500);
      });
    });
  </script>
</body>
</html>
